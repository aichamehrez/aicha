# ==============================================================================
#  Ansible Configuration — ansible.cfg
#  Drop this in the ansible/ directory so ansible-playbook picks it up
#  automatically without needing -i flags every time.
# ==============================================================================

[defaults]
# Default inventory — no need to pass -i every run
inventory = inventory.ini

# Suppress deprecation warnings for cleaner output
deprecation_warnings = False

# Increase default timeout for large model downloads
timeout = 1200

# Show task timing at the end of every play
callbacks_enabled = timer, profile_tasks

# SSH pipelining — greatly speeds up task execution
pipelining = True

# Don't gather all facts — only gather what tasks explicitly need
# (comment out if a task fails due to missing ansible_* vars)
# gathering = explicit

# Output formatting
stdout_callback = yaml
bin_ansible_callbacks = True

[ssh_connection]
# Persist SSH connections across tasks for the same host
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# Speed up file transfers
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
