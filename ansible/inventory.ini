# ==============================================================================
#  Ansible Inventory — Ollama Target Hosts
#  Mirrors TARGET_VM_* variables from .env
#  Edit the IP/user/password to match your VirtualBox VM before running.
# ==============================================================================

[ollama_hosts]
target-vm ansible_host=192.168.56.101 ansible_port=22

[ollama_hosts:vars]
# SSH authentication
ansible_user=vagrant
ansible_password=vagrant
ansible_become=true
ansible_become_method=sudo
ansible_become_password=vagrant

# Disable host key checking for local VM targets
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Python interpreter on the target VM
ansible_python_interpreter=/usr/bin/python3
